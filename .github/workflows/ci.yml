---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'd9e2ca3a4a7646bf7b4a810567db65a781267ce6' # v0.116.5
    permissions:
      contents: read
      pull-requests: write
