---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003  # v0.77.7
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b777111fb3aaa6f09589fb029f0094a05dd76003  # v0.77.7
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
    permissions:
      contents: read
      pull-requests: write
