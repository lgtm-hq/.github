---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@e10242e81ebb34ceb796efeff39ba9824178f46e  # v0.75.2
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'e10242e81ebb34ceb796efeff39ba9824178f46e' # v0.75.2

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@e10242e81ebb34ceb796efeff39ba9824178f46e  # v0.75.2
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'e10242e81ebb34ceb796efeff39ba9824178f46e' # v0.75.2
    permissions:
      contents: read
      pull-requests: write
