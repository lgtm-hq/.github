---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5'  # v0.52.3

  validate-org-config:
    name: Validate Org Config
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      job-name: Validate Org Config
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '66cad82ead0e5d119928c895c7d7da9c837989e5'  # v0.52.3
    permissions:
      contents: read
      pull-requests: write
