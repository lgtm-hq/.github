---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@a241d840eef03de2ab6002e64f4044f60ca6813b # v0.59.31
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'a241d840eef03de2ab6002e64f4044f60ca6813b' # v0.59.31

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@a241d840eef03de2ab6002e64f4044f60ca6813b # v0.59.31
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'a241d840eef03de2ab6002e64f4044f60ca6813b' # v0.59.31
    permissions:
      contents: read
      pull-requests: write
