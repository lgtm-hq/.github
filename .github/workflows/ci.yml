---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@d1a4cbe278d60e631d95800f449d25e174140ea1  # v0.77.4
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@d1a4cbe278d60e631d95800f449d25e174140ea1  # v0.77.4
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
    permissions:
      contents: read
      pull-requests: write
