---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@614c5ad1fc91d742baed959643bdd1f261a71210  # v0.79.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@614c5ad1fc91d742baed959643bdd1f261a71210  # v0.79.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
    permissions:
      contents: read
      pull-requests: write
