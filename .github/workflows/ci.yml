---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
    permissions:
      contents: read
      pull-requests: write
