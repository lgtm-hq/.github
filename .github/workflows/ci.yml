---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc # v0.69.2
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc # v0.69.2
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
    permissions:
      contents: read
      pull-requests: write
