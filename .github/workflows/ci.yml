---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@d32388495d571a0ee13383bacc732765bf4e9e7d  # v0.74.6
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d'  # v0.74.6

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@d32388495d571a0ee13383bacc732765bf4e9e7d  # v0.74.6
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d'  # v0.74.6
    permissions:
      contents: read
      pull-requests: write
