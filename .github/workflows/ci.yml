---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@8a6b1f553f1a0400a70db8910094073ce803cc4d # v0.69.5
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '8a6b1f553f1a0400a70db8910094073ce803cc4d' # v0.69.5

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@8a6b1f553f1a0400a70db8910094073ce803cc4d # v0.69.5
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '8a6b1f553f1a0400a70db8910094073ce803cc4d' # v0.69.5
    permissions:
      contents: read
      pull-requests: write
