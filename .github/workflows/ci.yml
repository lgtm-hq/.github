---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@737747b1b8590900afc41a72efdd372e244ea39d # v0.69.10
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '737747b1b8590900afc41a72efdd372e244ea39d' # v0.69.10

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@737747b1b8590900afc41a72efdd372e244ea39d # v0.69.10
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '737747b1b8590900afc41a72efdd372e244ea39d' # v0.69.10
    permissions:
      contents: read
      pull-requests: write
