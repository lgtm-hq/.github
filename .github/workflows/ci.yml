---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
    permissions:
      contents: read
      pull-requests: write
