---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@79444626c1b3afa4d959b5840b4b5310a46a4095
    with:
      tooling-ref: "79444626c1b3afa4d959b5840b4b5310a46a4095"

  validate-org-config:
    name: Validate Org Config
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate Renovate config JSON
        shell: bash
        run: bash scripts/ci/validate-renovate-config.sh
