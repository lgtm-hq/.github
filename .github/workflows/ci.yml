---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@2145a9aa0b1c82939be0506763442df6ea36884d # v0.74.2
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '2145a9aa0b1c82939be0506763442df6ea36884d' # v0.74.2

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@2145a9aa0b1c82939be0506763442df6ea36884d # v0.74.2
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '2145a9aa0b1c82939be0506763442df6ea36884d' # v0.74.2
    permissions:
      contents: read
      pull-requests: write
