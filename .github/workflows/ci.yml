---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@a167ee7165319d00dc92604ecdef87b719a0a55d # v0.74.4
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'a167ee7165319d00dc92604ecdef87b719a0a55d' # v0.74.4

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@a167ee7165319d00dc92604ecdef87b719a0a55d # v0.74.4
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'a167ee7165319d00dc92604ecdef87b719a0a55d' # v0.74.4
    permissions:
      contents: read
      pull-requests: write
