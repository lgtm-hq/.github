---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b  # v0.59.30
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b'  # v0.59.30

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b  # v0.59.30
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b'  # v0.59.30
    permissions:
      contents: read
      pull-requests: write
