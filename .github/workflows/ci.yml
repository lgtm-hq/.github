---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@aaa960d8bfa543e532830c53e5446372c8e80c7e # v0.84.1
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'aaa960d8bfa543e532830c53e5446372c8e80c7e' # v0.84.1

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@aaa960d8bfa543e532830c53e5446372c8e80c7e # v0.84.1
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'aaa960d8bfa543e532830c53e5446372c8e80c7e' # v0.84.1
    permissions:
      contents: read
      pull-requests: write
