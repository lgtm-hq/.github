---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@22bb159287eb23a812d533090615525eccb839ac  # v0.75.1
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '22bb159287eb23a812d533090615525eccb839ac' # v0.75.1

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@22bb159287eb23a812d533090615525eccb839ac  # v0.75.1
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '22bb159287eb23a812d533090615525eccb839ac' # v0.75.1
    permissions:
      contents: read
      pull-requests: write
