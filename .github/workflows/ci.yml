---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@229e00aaa727ecd88de5ab3711b07f701c4aae21  # v0.79.0
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '229e00aaa727ecd88de5ab3711b07f701c4aae21' # v0.79.0

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@229e00aaa727ecd88de5ab3711b07f701c4aae21  # v0.79.0
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '229e00aaa727ecd88de5ab3711b07f701c4aae21' # v0.79.0
    permissions:
      contents: read
      pull-requests: write
