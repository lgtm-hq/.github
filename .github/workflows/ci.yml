---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
    permissions:
      contents: read
      pull-requests: write
