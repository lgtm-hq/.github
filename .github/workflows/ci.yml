---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@234e84901ae4ac14f2d44f02fad517d95712cec3  # v0.75.0
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '234e84901ae4ac14f2d44f02fad517d95712cec3' # v0.75.0

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@234e84901ae4ac14f2d44f02fad517d95712cec3  # v0.75.0
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '234e84901ae4ac14f2d44f02fad517d95712cec3' # v0.75.0
    permissions:
      contents: read
      pull-requests: write
