---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: '0c373f1252e0fe23a1e119df639b51d63b02b7d8' # v0.116.3
    permissions:
      contents: read
      pull-requests: write
