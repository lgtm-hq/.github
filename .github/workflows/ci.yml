---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b1496d262b3b9fe6679f5d5240c2cd19e822fd6b # v0.84.2
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'b1496d262b3b9fe6679f5d5240c2cd19e822fd6b' # v0.84.2

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b1496d262b3b9fe6679f5d5240c2cd19e822fd6b # v0.84.2
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'b1496d262b3b9fe6679f5d5240c2cd19e822fd6b' # v0.84.2
    permissions:
      contents: read
      pull-requests: write
