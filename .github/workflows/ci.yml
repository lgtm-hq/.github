---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@d3736367191ddaf56c41804d2dd5174732ed2d2b  # v0.18.4
    with:
      tooling-ref: "d3736367191ddaf56c41804d2dd5174732ed2d2b"  # v0.18.4

  validate-org-config:
    name: Validate Org Config
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@d3736367191ddaf56c41804d2dd5174732ed2d2b  # v0.18.4
    with:
      job-name: Validate Org Config
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: "d3736367191ddaf56c41804d2dd5174732ed2d2b"  # v0.18.4
    permissions:
      contents: read
      pull-requests: write
