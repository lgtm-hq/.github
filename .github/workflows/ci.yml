---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921 # v0.69.4
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921 # v0.69.4
    with:
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
    permissions:
      contents: read
      pull-requests: write
