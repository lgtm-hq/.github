---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
      packages: read  # pull lintro-image from GHCR in reusable-quality-lint
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      egress-policy: block
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@cade5e687630ce3208bf914d0b1590145f3d569e # v0.83.11
    with:
      egress-policy: block
      job-name: "🧾 Validate Org Config"
      script: scripts/ci/validate-renovate-config.sh
      tooling-ref: 'cade5e687630ce3208bf914d0b1590145f3d569e' # v0.83.11
    permissions:
      contents: read
      pull-requests: write
