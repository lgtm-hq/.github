---
name: PR - Auto Assign

# Assigns a random CODEOWNER to new pull requests so bot-opened PRs
# (Renovate, org config changes) always get a deterministic reviewer.
#
# pull_request_target is required because pull-requests: write is not granted
# to fork PRs under pull_request. The called reusable workflow must therefore
# never check out the PR head ref — it only reads CODEOWNERS from the base ref
# and calls the GitHub API. Keep it that way when bumping the pin.

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc # v0.69.2
    with:
      job-name: "👤 Auto Assign CODEOWNER"
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
    permissions:
      contents: read
      # the reusable assigns a random CODEOWNER to the pull request
      pull-requests: write
