---
# Org config repo — no Python/JS/Rust sources; run applicable lintro tools only.
# https://github.com/lgtm-hq/py-lintro

enforce:
  line_length: 88

execution:
  tool_order: priority
  fail_fast: false

# Fallbacks for tools without a native config file. yamllint is configured in
# the root .yamllint instead — `defaults` is only consulted when no native
# config exists, so a block here would be dead config and would silently
# disagree with .yamllint.
defaults:
  shellcheck:
    severity: warning

tools:
  actionlint:
    enabled: true
  gitleaks:
    enabled: true
  # No Python files in this repo. Skip mypy until py-lintro#930 treats that as a
  # clean no-op in Docker (CI lintro image currently fails with exit code 1).
  mypy:
    enabled: false
  osv_scanner:
    enabled: true
  prettier:
    enabled: true
  # lintro 0.147.x bundles pylint, which scans the vendored lgtm-ci tooling
  # scripts here and in consumers; that catalogue is gated upstream in
  # lgtm-ci's own repo. Keep pylint out of this repo's gate.
  pylint:
    enabled: false
  semgrep:
    enabled: true
  shellcheck:
    enabled: true
  shfmt:
    enabled: true
  yamllint:
    enabled: true
