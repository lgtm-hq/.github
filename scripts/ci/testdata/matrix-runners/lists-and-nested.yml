---
name: Matrix list and nested runs-on keys

"on":
  workflow_dispatch:

jobs:
  listed:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - run: echo ok

  nested:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: macos-14
          - os: ubuntu-22.04-arm
    steps:
      - run: echo ok

  literal:
    runs-on: ubuntu-24.04
    steps:
      - run: echo skip
