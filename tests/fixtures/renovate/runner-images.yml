---
name: Runner image extraction fixture
"on": workflow_dispatch

jobs:
  expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  compact-expression:
    runs-on: ${{vars.LGTM_CI_RUNNER||'ubuntu-28.04'}}
    steps:
      - run: "true"

  unquoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-24.04

  single-quoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: 'ubuntu-26.04'

  double-quoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: "ubuntu-28.04"

  literal-label:
    runs-on: ubuntu-26.04
    steps:
      - run: "true"

  unrelated-variable:
    runs-on: ${{ vars.OTHER_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  blacksmith-expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - run: "true"

  blacksmith-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: blacksmith-2vcpu-ubuntu-2604

  latest-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-latest
