---
name: Runner image extraction fixture
"on": workflow_dispatch

# Workflow-level multiline text must not masquerade as job fields.
run-name: |
  Example:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    with:
      runner-image: ubuntu-24.04

env:
  runner-notes: |
    with:
      runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}

jobs:
  expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  compact-expression:
    runs-on: ${{vars.LGTM_CI_RUNNER||'ubuntu-28.04'}}
    steps:
      - run: "true"

  unquoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # Other inputs and comments can precede the override.
      job-name: Ubuntu 24.04

      runner-image: ubuntu-24.04 # Keep 24.04 in this comment.

  single-quoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # prettier-ignore
      runner-image: 'ubuntu-26.04'

  literal-label:
    runs-on: ubuntu-26.04
    steps:
      - run: "true"

  unrelated-variable:
    runs-on: ${{ vars.OTHER_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  blacksmith-expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'blacksmith-2vcpu-ubuntu-2604' }}
    steps:
      - run: "true"

  blacksmith-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: blacksmith-2vcpu-ubuntu-2604

  latest-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-latest

  suffixed-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-90.04-custom

  quoted-suffixed-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: "ubuntu-90.04-arm"

  hash-suffixed-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-90.04#custom

  longer-key:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      custom-runner-image: ubuntu-90.04

  commented-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # runner-image: ubuntu-90.04
      job-name: Quality

  string-input:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      job-name: "runner-image: ubuntu-90.04"

  multiline-input:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      script: |
        with:
          runner-image: ubuntu-90.04

  script-content:
    runs-on: ubuntu-26.04
    env:
      runner-image: ubuntu-90.04
    steps:
      - run: |
          runner-image: ubuntu-90.04
          echo "runner-image: ubuntu-90.04"
          with:
            runner-image: ubuntu-90.04

  multiline-before-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      script: |
        echo hello
        runner-image: ubuntu-24.04
        with:
          runner-image: ubuntu-24.04
      runner-image: ubuntu-24.04

  quoted-siblings-before-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      "job-name": Ubuntu 24.04
      # prettier-ignore
      'script': >-
        echo hello
        runner-image: ubuntu-24.04
      runner-image: ubuntu-24.04

  continued-before-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # prettier-ignore
      job-name: "A long
        continued name"
      runner-image: ubuntu-24.04

  expression-input:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      "job-name": Quality
      script: |
        runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
      runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }} # Keep 26.04.

  collision-before:
    runs-on: ubuntu-26.04
    env:
      runner-image: ubuntu-24.04
      runner-expression: |
        runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  collision-target:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: ubuntu-24.04 # Keep 24.04 in this comment.

  collision-after:
    runs-on: ubuntu-26.04
    env:
      runner-image: ubuntu-24.04
    steps:
      - run: "true"

  boundary-source:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      script: |
        echo no runner input here

  boundary-next-job:
    runs-on: ubuntu-26.04
    env:
      runner-image: ubuntu-24.04
    steps:
      - run: "true"

  expression-exclusions:
    # runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    runs-on: ubuntu-26.04
    env:
      runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
      example: "${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}"
      runner-notes: |
        runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: |
          # runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
          runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
          runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
          echo "${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}"
          with:
            runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
      - uses: example/action@0123456789012345678901234567890123456789
        with:
          runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}

  commented-expression-input:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # runner-image: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
      job-name: "${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}"

  appended-expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}-custom
    steps:
      - run: "true"

  compound-expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' || 'ubuntu-28.04' }}
    steps:
      - run: "true"

  prefixed-expression:
    runs-on: custom-${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  suffixed-expression:
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04-arm' }}
    steps:
      - run: "true"

  longer-variable:
    runs-on: ${{ vars.LGTM_CI_RUNNER_X || 'ubuntu-26.04' }}
    steps:
      - run: "true"

  string-expression-input:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      runner-image: "Example: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}"

  double-quoted-override:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with: # Inline comments are allowed on the input block.
      runner-image: "ubuntu-28.04" # A complete quoted label.
